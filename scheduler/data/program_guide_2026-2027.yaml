# The Columbus School — High School Program Guide 2026-2027
#
# Codifica el PDF oficial:
#   /Users/hector/Downloads/High School Program Guide 2026-2027 for Students and Parents.pdf
#
# Estructura por grado:
#   required:        Cursos que TODOS los estudiantes del grado toman
#   optative_areas:  Áreas obligatorias — el estudiante toma UN curso por área
#   electives:       Cursos opcionales — el estudiante puede tomar máx 1
#
# El motor lo usa para:
#   - Marcar requests como is_required=True si el curso es Required o Optative
#     (porque para ESE estudiante específico, ese curso ES obligatorio)
#   - Validar que cada estudiante tenga cobertura (1 curso por área optative)
#   - Reportar warnings si data del xlsx tiene huecos
#
# Course codes son los COURSE_NUMBER reales del archivo xlsx del Colegio.
# Para mapear PDF (display name) → code, se cruza con la hoja `courses`
# del archivo schedule_master_data_hs.xlsx.

9:
  required:
    - A0901   # Biology 9
    - H0904   # English 9
    - B0901   # Social Studies 9
    - E0901   # PE 9
  optative_areas:
    Spanish:
      - G0901   # Español & Literatura 9
      - G0902   # Spanish 9 (Foreign Language)
    Math:
      # 'Either Algebra I or Geometry — determined by what student took in 8th grade'
      # If had Math 8 → Algebra I; if had Algebra I → Geometry
      - I0903   # Algebra I 9
      - I1003   # Geometry
    Technology:
      - J0901   # Technology 9
      - J0903   # FRC 9 (Robotics)
    Art:
      - OC1305  # Painting I
      - OC1307  # Drawing I
      - OC1306  # Sculpture I
      - C0904   # Band Level I
  electives: []   # PDF: G9 no tiene electives (solo required + optative)

