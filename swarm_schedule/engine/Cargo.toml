[package]
name = "scheduler_core"
version = "0.1.0"
edition = "2021"
description = "Constraint engine for school scheduling - swarm experiment"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
rand = "0.8"
fnv = "1.0"
lazy_static = "1.4"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "scheduler_core"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
